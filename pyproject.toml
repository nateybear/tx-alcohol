[project]
name = "alcohol"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "dotenv>=0.9.9",
    "folium>=0.20.0",
    "geopandas>=1.1.4",
    "geopy>=2.5.0",
    "haversine>=2.9.0",
    "json3>=1.0",
    "mapclassify>=2.11.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "osrm-bindings>=26.10.0",
    "pandas>=3.0.5",
    "pyarrow>=25.0.1",
    "rdatasets>=0.2.10",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "snakemake>=9.27.0",
    "sodapy>=2.2.0",
    "torch>=2.14.0",
]

[dependency-groups]
dev = [
    "ipython>=9.17.1",
    "ruff>=0.16.8",
    "snakemake>=9.27.0",
    "ty>=0.0.83",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alcohol"]
